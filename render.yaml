services:
  - type: web
    name: Arnav_FinPulse_Backend
    env: python
    pythonVersion: "3.11.7"
    region: oregon
    plan: free
    github:
      repo: arnavnoncode/Arnav_FinPulse
      branch: main
    buildCommand: pip install -r requirements.txt
    # The API seeds mock data itself on startup if the companies table is
    # empty (see finpulse/api/main.py's startup hook), so no separate
    # seeding process is needed here.
    startCommand: uvicorn finpulse.api.main:app --host 0.0.0.0 --port 8000
