services:
  - type: web
    name: Arnav_FinPulse_Backend
    env: python
    pythonVersion: "3.11.7"
    region: oregon
    plan: free
    github:
      repo: arnavnoncode/Arnav_FinPulse
      branch: main
    buildCommand: pip install -r requirements.txt
    # Run mock seeder first (ensures DB is populated), then start the web server.
    startCommand: python -m finpulse.ingestion.mock_ingest && uvicorn finpulse.api.main:app --host 0.0.0.0 --port 8000
    # releaseCommand kept for compatibility but startCommand will ensure seeding runs
    releaseCommand: python -m finpulse.ingestion.mock_ingest
